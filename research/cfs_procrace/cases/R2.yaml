assumptions_needed:
  - "A1: cFE = B (or bundle 9c786d25 with cfe 18651ef6, osal 3bcb1377, psp 9173cba3) represents the reporter's 'cFE v6.7' on main (needs D1)."
  - "A2: bundle README setup with unmodified sample_defs and Makefile.sample (default object table and platform config; example_platform_cfg.h not renamed, so B's module defaults apply; PSP pc-linux as cmake selects for a native Linux build)."
  - "A3: BUILDTYPE/ARCH/O not set on the command line or in the environment, so Makefile.sample defaults debug / native/default_cpu1 / build apply; OMIT_DEPRECATED and ENABLE_UNIT_TESTS unset (README 'debug, permissive mode'); outcome expected independent of OMIT_DEPRECATED."
  - "A4: Ubuntu 22.04 distribution GCC/gdb; versions unknown; container differences recorded as deviation."
  - "A5: normal user per README quick-start, host CPU count; expected not to change R2 order under S1 (inference) but changes RT priority use/timing."
  - "A6: outcome recorded at U0 by a recorder independent of EVS/SB/TIME/ES GetAppID (roadmap 6.3 rule 5): every call with task identity, AppID passed, EventID, status returned; boots compared by hit sets, not against a fixed count; gdb all-stop as in the issue does not change S1 order (inference); gdb launch mode not stated."
  - "A7: no startup timeout (CFE_ES_MainTaskSyncDelay succeeds)."
  - "A8: current-code arm uses M or D with default MISSION_CORE_MODULES order (D4)."
  - "A9 (only for D5 variant): event-based hold of the ES startup thread after CFE_ES_StartAppTask returns and before app-record finalization until SB's CFE_ES_GetAppID is observed; role-derived, not part of R2 original-case results."
  - "A10: any publish-first control (e.g. sb before es/evs in MISSION_CORE_MODULES) is a constructed configuration variant; must not be presented as evidence that the original configuration races (roadmap 6.4)."

open_questions:
  - "Q1: At B, ES is created after SB is RUNNING (S1+S3), so ES's SB calls should not hit ILLEGAL_APP_ID; why does the report say 'the ES and the EVS tasks'? (misattribution via CFE_ES_TaskEntryPoint frame, local modification/other branch, or the S7 window). The [R2-analysis] snippets do not settle it: their line numbers follow M / early-September dev, where ES precedes SB."
  - "Q2: Remainder of the two comments: the three elided spans of the analysis comment, a verbatim check of the model-mediated snippet text, confirmation that the analysis comment is issuecomment-5588955819 and the CCB comment is dzbaker's, and both exact timestamps (D3). Most of the text is retrieved as snippets; the analysis does not classify the defect ('deterministic' there describes EVS_GetAppDataByID)."
  - "Q3: Are the per-boot U0 hit sets (task, AppID, EventID, status) identical across boots at B and at M/D? Code gives lower bounds only (B >= 4, all CFE_EVS; M/D >= 9); a 4th or later hit at B is expected, not a race signal. A race signal is a hit set that differs between boots of the same build and configuration."
  - "Q4: Reporter's exact environment: commits, privileges, OMIT_DEPRECATED, compiler/gdb versions."
  - "Q5: Intended semantics for SB events emitted for callers before SB is ready (attribute to SB via early AppId assignment, drop, queue, or syslog)? References for options, none decided: cfe_evs.h L169-L172 directs reporting outside a registered application's context (e.g. early in app initialization) to CFE_ES_WriteToSysLog, but does not address SB-attributed events emitted for a caller; the [R2-analysis] snippet proposes resolving SB's AppId lazily on first use, or having CFE_SB_EarlyInit record it (the latter, as excerpted, does not match the code; fix.proposals_in_comment.caveat); the CCB marked the issue 'Tracked internally'."
  - "Q6: Does any reference require es and evs before sb in MISSION_CORE_MODULES, beyond 'the order of this list is the order in which they will be initialized'?"
  - "Q7: Should R2 and C3's residual 'SB AppId before publication' path be counted as one pattern (roadmap 9.3)?"
  - "Q8: Exact timestamps of the two comments (2026-09-08 for issuecomment-5588955819 is an inference from ID adjacency, last-update bisection and snippet text; CCB comment only bounded: on or after 2025-09-04, before 2026-09-08)."

