issue_body_verbatim:
  note: "Fragments as returned by WebFetch (model-mediated); verify before quoting in the paper."
  describe_the_bug:
    - "When the ES and the EVS tasks initializes, they make various CFE_SB API calls"
    - "(i.e. `CFE_SB_CreatePipe()` and `CFE_SB_Subscribe()`)"
    - "which in turn call `CFE_EVS_SendEventWithAppID()` passing in the AppId for the CFE_SB."
    - "`CFE_EVS_SendEventWithAppID()` then returns a `CFE_EVS_APP_ILLEGAL_APP_ID`"
    - "presumably because CFE_SB has not been registered with event services."
    - "This might have gone unnoticed because there is no event outputted"
    - "nor is the return code set to any variable."
  to_reproduce:
    - "make SIMULATION=native prep"
    - "make"
    - "make install"
    - "Place a breakpoint here - https://github.com/nasa/cFE/blob/main/modules/evs/fsw/src/cfe_evs.c#L185"
    - "Run the gdb and see it stopped at the breakpoint."
  system_observed_on: ["OS: Ubuntu 22.04.5 LTS", "cFE v6.7"]
  reporter_info: "Michael Yang - NASA/GSFC"
  gdb_observation: "Only 'stopped at the breakpoint'. No gdb output, backtrace, thread names, hit count or status value given."

