required_order:
  statement: "CFE_SB_AppInit must store a valid SB AppId (cfe_sb_task.c L126 at B), and for generated rather than unregistered-handled events also register SB with EVS (L193), before any task executes an SB API path that emits an event with CFE_SB_Global.AppId. For R2 this means EVS init (U1) and, at M/D, ES init (U2) would have to run after SB AppInit; S1+S3 make them run before (inference)."
  provenance:
    - {kind: api_doc, ref: "https://github.com/nasa/cFE/blob/fc8c48ad09460ce0277ad2bfcd81d376634aa2c6/modules/core_api/fsw/inc/cfe_evs.h#L165-L172", text: "L165-L166: Note that this function should really only be used from within an API in order to preserve the context of an Application's event.  In general, #CFE_EVS_SendEvent should be used. L169-L172: The Application ID must correspond to a registered application or core service. For messages outside the context of a registered application (for example early in app initialization or if registration fails) #CFE_ES_WriteToSysLog can be used for reporting. (identical in M and D)"}
    - {kind: code, ref: "cfe_evs.c L182-L191 and resource ID conversion (resource.why_invalid_refs)", text: "undefined ID -> NULL -> ILLEGAL_APP_ID; valid-but-unregistered -> EVS_NotRegistered"}
    - {kind: issue, ref: "https://github.com/nasa/cFE/issues/2663", text: "presumably because CFE_SB has not been registered with event services. (reporter hypothesis; inference: code points to AppId publication, not registration, as what selects ILLEGAL_APP_ID)"}
    - {kind: comment_snippets, ref: "https://github.com/nasa/cFE/issues/2663#issuecomment-5588955819 (identity inferred)", text: "'SB attributes pipe-creation events to ... itself using CFE_SB_Global.AppId, but that field is only filled in CFE_SB_AppInit (cfe_sb_task.c:138) when the SB task runs.' 'Whichever core app's init runs before that sees SB call CFE_EVS_SendEventWithAppID with an undefined AppId, which is exactly the error reported here.' (search snippets, model-mediated, truncated; the commenter's code reading, not an execution result; its 'deterministic' refers to EVS_GetAppDataByID, not to R2)"}
  classification_inference: "roadmap 7.3 row 'startup procedure always forces the unready use' -> deterministic initialization-dependency defect in the default configuration; code-only, not executed; pending Q1 and D5."

