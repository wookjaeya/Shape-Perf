assumptions_needed:
  - "A1 (deviation from Microblaze): derived platform = 32-bit x86 Linux (CentOS 6.x) + 6.4.1 pc-linux PSP + POSIX OSAL, built -m32 with -g -O0 (from-reference for the derived platform, see reproduction.conditions word_size_build_flags_derived); scheduling, memory layout and fault behaviour differ from Microblaze. Host distribution/version available in the container not yet checked. A 64-bit build is a separate deviation that must be justified."
  - "A2: OSAL source FETCHED: nasa/osal tag osal-4.1.1 -> 2f1fdb0c89523ba865dda65bbf599671a7a79fa3 (/home/user/work/procrace/src/C3-provenance/osal-4.1.1). References: 641:osal/readme.txt names 'sourceforge.net/projects/osal or github.com/nasa.osal' (sic); 641:cfe-OSS-readme.txt:L77-L78 names 'github.com/nasa/osal'. Identity with SourceForge osal-4.1.1-release.tar.gz unverified. Requirement is >= 4.1.1; 4.1.1 is the tested/example version, not uniquely determined."
  - "A3 (D3): order control - either priority-driven (pc-linux PSP SCHED_FIFO max main thread; OSAL 4.1.1 applies SCHED_FIFO and remapped priorities only as root (from-reference); needs A10; container root/RT support unverified) or event-based hold of CFE_SB_AppInit and CFE_EVS_TaskInit until TIME's first CFE_EVS_SendEventWithAppID from CFE_SB_CreatePipe is observed; no fixed delays."
  - "A4 (input to D4): under the reference-following -m32 build, AppData[0xFFFFFFFF] wraps to AppData[-1], the memory just before CFE_EVS_GlobalData (AppData is its first member) (inference); whether that faults is unspecified_by_reference. In a 64-bit build (deviation) it lands ~4G x sizeof(EVS_AppData_t) past the array. The choice of primary observable is decision D4, not made here."
  - "A5: platform configuration. Derived pc-linux: cpu1, from-reference (reproduction.conditions platform_config_derived) - not an assumption. EVA: unspecified_by_reference; that EVA used the 'default/example' values the issue cites remains an assumption (eva_used_default_priorities)."
  - "A6: reset type. Derived pc-linux: power-on, from-reference (reset_type_derived_pc_linux). EVA: unspecified_by_reference."
  - "A7: fixed-side control - options (6.4.2 tarball vs v6.5.0a) listed under D2; no choice made here."
  - "A8: ablations 'order guarantee only' (F3) and 'guard only' (F1) are constructed subsets of the 6.4.1->6.4.2 diff, not historical revisions."
  - "A9: recorder must not depend on EVS, SB or TIME (roadmap sec 6.3 item 5)."
  - "A10 (needed for D3(a)): single CPU or equivalent restriction (e.g. affinity). inference: on SMP Linux a newly created EVS thread can run on another CPU before TIME is even created. No reference states a CPU count."

