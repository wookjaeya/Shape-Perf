resource:
  name: "CFE_ES_Global.TaskTable[TaskId] (RecordUsed, AppId, TaskId, TaskName): the OS-task -> cFE-AppID link"
  index: "TaskId = OSAL task ID returned by OS_TaskCreate (array index in OSAL 4.1.1); readers use OS_TaskGetId()"
  sharers: ["creating ES context (CFE_ES_Main startup thread for startup-script apps; CFE_ES task for Start App cmd / restart / reload)", "new app main task"]
  secondary_fields_in_window:
    - "AppTable[i].TaskInfo.MainTaskId written by OSAL inside OS_TaskCreate while ES lock is released (OSAL posix L690) [inference: unsynchronized]"
  not_in_window:
    - "AppStartupCounter++ (SF-6.4.1 cfe_es_apps.c L670) runs after OS_TaskCreate but inside the re-locked section L637-L673, atomically with the TaskTable registration. Lock-protected decrements need a successful GetAppIDInternal under the same lock (RunLoop L546/L551/L553 -> L593; WaitForStartupSync L690/L700/L701 -> L720), so they cannot run for the new task before L673. A counter ordering problem would need the A8 path or a stale RecordUsed entry (unverified). Earlier inference 'window also affected the startup-sync counter' withdrawn."

