issue_body_verbatim:
  - "Although the cFE 6.4.2 release improved synchronization during start up,"
  - "it only implements a single state (`OPERATIONAL`) which is supposed to indicate when everything is ready."
  - "However, this may not be sufficient for all applications."
  - "Specifically, some applications have an \"early\" init in which its local data structures are all set to an initial state,"
  - "followed by a \"late\" init that may require some communications with other applications or libraries."
  - "An application would need to also complete this \"late\" initialization in order to be considered completely up and running."
  - "Currently the start up sync only handles the early init; late init, if required, is generally done"
  - "while in the \"operational\" state but this also a race condition in that requests can be made to an application"
  - "that has not been fully initialized."
  - "This race condition was observed in the EVA CWS project where one app needed to wait for other apps to be fully loaded"
  - "before completing its initialization, so it was using `CFE_ES_WaitForStartupSync()` before doing its late-phase init."
  - "But other applications (also using the same sync call) were calling other functions before the late-phase init had completed."
  - "The solution is to add another CFE startup state for this late-phase init."

