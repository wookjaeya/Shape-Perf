  guarantees:
    - "F3: core TaskInit k+1 starts only after core task k finished TaskInit and called WaitForStartupSync (table order EVS->SB->ES->TIME->TBL, independent of priority); TIME's CreatePipe runs after SB and EVS init. Fail-stop: panic on 30 s timeout. (inference from code + VDD row #40)"
