    options: ["cFE 6.4.1 tarball (sha256 ec26e33b...); backed by 6.4.2 VDD section 1.1 ('startup race conditions that were found in cFE build 6.4.1')", "cFE 6.4.0 tarball (sha256 6f1ce989...), equivalent alternative: cfe_es_apps.c byte-identical"]
