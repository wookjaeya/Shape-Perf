  name: CFE_SB_Global.AppId
  description: "ES AppId of the SB core app; used as event source ID by every SB API path that emits an event (in the caller's task)."
  definition: https://github.com/nasa/cFE/blob/fc8c48ad09460ce0277ad2bfcd81d376634aa2c6/modules/sb/fsw/src/cfe_sb_task.c#L40
  pre_publication_value:
    value: "0 == CFE_ES_APPID_UNDEFINED (memset in CFE_SB_EarlyInit, run as object-table function entry before any core task)"
    refs:
      - https://github.com/nasa/cFE/blob/fc8c48ad09460ce0277ad2bfcd81d376634aa2c6/modules/sb/fsw/src/cfe_sb_init.c#L55-L61
