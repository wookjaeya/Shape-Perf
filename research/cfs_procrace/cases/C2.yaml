assumptions_needed:
  - "ASSUMPTION A1 (user decision D2): buggy-side revision 6.4.2 tarball vs v6.5.0a; fixed side v6.6.0a vs current dev f22e538c."
  - "ASSUMPTION A2: role-based apps P (late-init app) and >=1 R ('other applications'); count, names, startup-script order, priorities recorded as assumptions. Treating P as a provider that R calls is itself an assumption (required_order.inferences (a)/(b))."
  - "ASSUMPTION A3 (user decision D4): request mechanism R->P and P's observable readiness indicator (e.g., flag set at end of late init); that R's calls target P at all is an assumption; must not be presented as original."
  - "ASSUMPTION A4: oracle = R's request entry observed before P's late-init-complete event; any crash/assertion added is a derived result."
  - "ASSUMPTION A5: event-based timing control (hold P's late-init completion until R's request entry is observed), no fixed delays; only reference constants are sample-config timeouts."
  - "ASSUMPTION A6: native Linux (pc-linux PSP). For EVA CWS this is an assumption (original platform unknown, no reference value to deviate from), not a deviation. pc-linux is reference-tested for 6.5.0 and 6.6.0 and listed as supported ('X86/PC running Linux') for 6.4.2. OSAL/PSP must follow the per-revision reference pairing (platform.per_revision_pairing), not a free pairing; only a departure from that pairing would be a deviation."
  - "ASSUMPTION A7: timeout arguments P and R pass to the sync API. Doc says 'at least 1000 ... rounded up', but this is doc-only: the code passes TimeOutMilliseconds unchanged (see sync_timeout_argument_P_R note), so a value below 1000 is used as given."
  - "ASSUMPTION A8: fixed-side variants - P uses WaitForSystemState(APPS_INIT); P keeps 6.4.2 pattern on 6.6.0a code; ES phase-2 timeout expires first; R uses NOT_READY handling/retry."
  - "ASSUMPTION A9: whether P's late init sends requests to R (issue: 'may require some communications with other applications')."

