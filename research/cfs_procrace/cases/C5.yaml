existing_sync:
  - mechanism: "ES shared-data mutex"
    effect: "protects each read/write section individually; released at L610 and re-taken at L637 around OS_TaskCreate, so it does not order registration before the new task's first read"
    reference: "SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_apps.c#L571-L673; SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_api.c#L851-L867"
  - mechanism: "mutex protocol PTHREAD_PRIO_INHERIT (OSAL posix)"
    reference: "https://github.com/nasa/osal/blob/2f1fdb0c89523ba865dda65bbf599671a7a79fa3/src/os/posix/osapi.c#L3158-L3161"
  - mechanism: "creation order"
    effect: "task created (L614) before registration (L637-L673): opposite of the required order"
    reference: "SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_apps.c#L610-L673"
  - mechanism: "OSAL OS_task_table_mut"
    effect: "protects OSAL table only; not held across pthread_create"
    reference: "https://github.com/nasa/osal/blob/2f1fdb0c89523ba865dda65bbf599671a7a79fa3/src/os/posix/osapi.c#L519-L704"
  - mechanism: "OS_TaskRegister / OS_TaskGetId (thread-specific key)"
    effect: "identity lookup only; OS_TaskGetId returns 0 if OS_TaskRegister never succeeded"
    reference: "https://github.com/nasa/osal/blob/2f1fdb0c89523ba865dda65bbf599671a7a79fa3/src/os/posix/osapi.c#L906-L972"
  - mechanism: "priorities"
    effect: "per-app priority from startup script/command; Linux priorities and SCHED_FIFO only when root. Creator on pc-linux: when root, OS_API_Init sets the main thread to SCHED_FIFO 50, then the PSP raises it to SCHED_FIFO max ('Raise the priority of the main thread so ES Main completes') before CFE_ES_Main and lowers it to min afterwards, so startup-script AppCreate runs at SCHED_FIFO max. ES task (runtime Start App path) uses CFE_ES_START_TASK_PRIORITY 68, remapped by OS_PriorityRemap. Sample script makes five CFE_ES_AppCreate calls, SAMPLE_LIB (CFE_APP, pri 0, stack 0) first; do not 'correct' L1 to CFE_LIB (would be a deviation)."
    inference: "as root on one CPU a new app task cannot preempt the startup creator between L614 and L637 (it could still run if the creator blocks); the startup path's window on pc-linux then needs >1 CPU, non-root (SCHED_OTHER), or the runtime Start App path. CPU count, root and priorities remain unspecified_by_reference."
    reference: ["SF-6.4.1:build/cpu1/exe/cfe_es_startup.scr#L1-L5 (L1 'CFE_APP, /cf/apps/sample_lib.so,  SAMPLE_LibInit,  SAMPLE_LIB,    0,   0,    0x0, 0;', L2 SAMPLE_APP 50/8192, L3 CI_LAB_APP 60/8192, L4 TO_LAB_APP 70/8192, L5 SCH_LAB_APP 80/8192; identical in 6.4.0 and 6.4.2)", "SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_apps.c#L371 and #L387 (CFE_APP entry -> CFE_ES_AppCreate)", "SF-6.4.1:cfe/fsw/platform_inc/cpu1/cfe_platform_cfg.h#L1161 (CFE_ES_START_TASK_PRIORITY 68)", "https://github.com/nasa/osal/blob/2f1fdb0c89523ba865dda65bbf599671a7a79fa3/src/os/posix/osapi.c#L435-L453", "https://github.com/nasa/osal/blob/2f1fdb0c89523ba865dda65bbf599671a7a79fa3/src/os/posix/osapi.c#L587-L640", "SF-6.4.1:psp/fsw/pc-linux/src/cfe_psp_start.c#L352-L366 (raise to max, CFE_ES_Main)", "SF-6.4.1:psp/fsw/pc-linux/src/cfe_psp_start.c#L375-L379 (lower to min); file identical in 6.4.2"]
  - mechanism: "startup sync (CFE_ES_WaitForStartupSync, 6.4.1)"
    effect: "orders apps against all-startup-apps-running; does not order a task's first GetAppID against its own registration; its counter is incremented after task creation, under the re-taken lock, together with the registration (L637-L673)"
    reference: "SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_api.c#L676-L756"
  - mechanism: "issue's 'safe' paths (checked)"
    effect: "CFE_ES_CreateObjects lock L838 -> OS_TaskCreate L875 -> registration L910-L922 -> unlock L933; CFE_ES_CreateChildTask lock L1076 -> OS_TaskCreate L1108 -> registration L1116-L1118 -> unlock L1145"
    reference: ["SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_start.c#L838-L933", "SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_api.c#L1076-L1145"]
  - inference: "In 6.4.1 nothing orders registration before the new task's first lock-protected read; outcome depends on who takes the ES mutex first after OS_TaskCreate."

required_order:
  statement: "For the main task T created by CFE_ES_AppCreate, ES's registration of T in TaskTable[TaskId] (RecordUsed=TRUE, AppId=i; 6.4.1 L649-L651, released at L673) must complete before T's first CFE_ES_GetAppID/GetAppIDInternal (or any API using them). Violation = GetAppID returns failure (CFE_ES_ERR_APPID) / RunLoop returns FALSE for a task ES is about to register; T merely running early is not the violation."
  provenance:
    - {kind: issue_text, reference: "https://github.com/nasa/cFE/issues/72", quote: "This unlock-relock opens up an opportunity for the child thread to read the shared table data before it is fully populated. ... CFE_ES_GetAppID() (which many tasks call very early in their init procedures) will fail"}
    - {kind: api_semantics, reference: "SF-6.4.1:cfe/fsw/cfe-core/src/es/cfe_es_api.c#L846-L871"}
    - {kind: fix, reference: "SF-6.4.1 -> SF-6.4.2 diff of cfe_es_apps.c (lock held L571-L669 across OS_TaskCreate)"}
    - {kind: maintainer_comment_later, reference: "https://github.com/nasa/cFE/blob/0749d692c0c402ed2f1f22913966225fe6345680/fsw/cfe-core/src/es/cfe_es_apps.c#L500-L506", quote: "there is a potential race condition if the real task code starts and calls e.g. CFE_ES_RegisterApp() or any other function that depends on having an AppID context, before its fully registered in the global app table."}
    - {kind: typical_caller, reference: "SF-6.4.1:apps/sample_app/fsw/src/sample_app.c#L77-L97"}
    - {kind: official_release_doc, reference: "VDD-6.4.2 Table 1.2-2 item 2 (Trac #41)", quote: "The unlock-relock code has been removed and updated to be the same as other areas where tasks are spawned."}

