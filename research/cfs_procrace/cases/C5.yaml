  original_ticket: {value: "cfs_cfe Trac #41", status: "inference (strongly supported): same title and milestone, matching description, and all five VDD tickets map to milestone-4 issues with offset +31 (#40->#71, #41->#72, #42->#73, #51->#82, #59->#90)"}
  version: "6.4.2 (tarball 2015-07-13; VDD dated June 29, 2015). The 6.4.2 ES sources all carry tar mtime 2015-06-29 17:04:20, including files unchanged from 6.4.1 (430 of 1277 entries share it): fixed code existed by that date; this does not date the fix. Matches GitHub milestone '6.4.2'"
  diff_summary:
    - "removed CFE_ES_UnlockSharedData before OS_TaskCreate (6.4.1 L610)"
    - "removed CFE_ES_LockSharedData on failure path (6.4.1 L628) and before registration (6.4.1 L637)"
