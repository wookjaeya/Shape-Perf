  possible_residual_window:
    status: inference_not_verified
    description: "Task record is published under lock in CFE_ES_StartAppTask (main L672-L722), but the App record stays RESERVED until a second critical section in CFE_ES_AppCreate (main L861 -> CFE_ES_AppRecordSetUsed L869 -> unlock L897). CFE_ES_GetAppID needs GetAppRecordByContext, which needs AppRecordIsMatch (resource.c L308-L341, resource.h L253-L256). Since 58abd38d the entry wait checks only the task record (before: GetAppRecordByContext at 0749d692). If the poll succeeds between L722 and L861, the app entry can run while CFE_ES_GetAppID returns CFE_ES_ERR_RESOURCEID_NOT_VALID."
    permalinks:
      - "https://github.com/nasa/cFE/blob/12cb84fc3ef22e584d94dba571e0c4f9a59397cb/modules/es/fsw/src/cfe_es_apps.c#L757-L897"
      - "https://github.com/nasa/cFE/blob/12cb84fc3ef22e584d94dba571e0c4f9a59397cb/modules/es/fsw/src/cfe_es_api.c#L738-L766"
      - "https://github.com/nasa/cFE/blob/12cb84fc3ef22e584d94dba571e0c4f9a59397cb/modules/es/fsw/src/cfe_es_resource.c#L308-L341"
      - "https://github.com/nasa/cFE/blob/12cb84fc3ef22e584d94dba571e0c4f9a59397cb/modules/es/fsw/src/cfe_es_resource.h#L253-L256"
    decision: D4

