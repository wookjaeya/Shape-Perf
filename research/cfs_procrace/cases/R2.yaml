required_order:
  statement: "CFE_SB_AppInit must store a valid SB AppId (cfe_sb_task.c L126 at B), and for generated rather than unregistered-handled events also register SB with EVS (L193), before any task executes an SB API path that emits an event with CFE_SB_Global.AppId. For R2 this means EVS init (U1) and, at M/D, ES init (U2) would have to run after SB AppInit; S1+S3 make them run before (inference)."
