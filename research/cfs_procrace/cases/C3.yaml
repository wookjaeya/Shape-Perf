assumptions_needed:
  - "A1 (deviation): x86-64 Linux host + 6.4.1 pc-linux PSP + POSIX OSAL in place of Microblaze; scheduling, memory layout and fault behaviour differ."
  - "A2: OSAL 4.1.1 source (sourceforge.net/projects/osal or github.com/nasa/osal per 641:osal/readme.txt) - not yet fetched; exact tag/hash to be recorded."
  - "A3 (D3): order control - either priority-driven (SCHED_FIFO main thread + RT priorities; container privilege unverified) or event-based hold of CFE_SB_AppInit and CFE_EVS_TaskInit until TIME's first CFE_EVS_SendEventWithAppID from CFE_SB_CreatePipe is observed; no fixed delays."
  - "A4 (D4): outcome criterion - out-of-range AppID (0xFFFFFFFF) reaching EVS_IsFiltered as primary observable; crash secondary (64-bit vs 32-bit OOB behaviour differs; inference)."
  - "A5: 6.4.1 platform_inc/cpu1/cfe_platform_cfg.h unchanged (issue cites 'default/example' values)."
  - "A6: power-on reset."
  - "A7: fixed-side control = 6.4.2 tarball (minimal diff) rather than v6.5.0a (many unrelated changes)."
  - "A8: ablations 'order guarantee only' (F3) and 'guard only' (F1) are constructed subsets of the 6.4.1->6.4.2 diff, not historical revisions."
  - "A9: recorder must not depend on EVS, SB or TIME (roadmap sec 6.3 item 5)."

