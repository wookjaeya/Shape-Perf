required_order:
  statement: "From-reference (issue, VDD): each core app reaches its main loop before the next core app starts, regardless of priority (sufficient condition). Fine-grained form, inference from code at the 641 pins (neither the issue nor the VDD states it): before TIME (or any task) executes CFE_SB_CreatePipe and its event calls with CFE_SB.AppId, (a) SB has published CFE_SB.AppId (641 sb_task.c:L198) and registered with EVS (L257), and (b) EVS has completed CFE_EVS_TaskInit (EVS_AppID valid at 641 evs_task.c:L385, EVS registered at L393)."
  provenance:
    - "#73 list1 item 1 (requirement) and list2 items 3-7 (failing order)"
    - "6.4.2 VDD Table 1.2-2 row Trac #40 ('forces each core application to reach its respective main loop before the next core application will be started regardless of the platform's priority settings')"
    - "6.4.2 VDD Table 1.2-2 row Trac #42 ('set the EVS_AppID value last. This will assure that all other initialization is done before the AppID is valid')"
    - "jphickey Trac comment 2015-05-07 10:41:17 ('There are two possible approaches to solving this'; option 2: startup sync so each core task reaches 'the run loop before starting the next task. This would only need to be done for the core tasks')"
    - "jphickey Trac comment 2015-05-08 13:39:51 ('DEPENDENCY NOTE: Trac #71 implements the first part of this fix,')"
    - "Trac comment (branch trac-42-rangecheck-evs-appid): 'that once the AppID is valid that all other initialization is also done.'"
  inference: "Crash condition: TIME's CFE_SB_CreatePipe event call happens while EVS has not reached 641 evs_task.c:L385 (EVS_AppID == 0xFFFFFFFF) AND AppData[CFE_SB.AppId].RegisterFlag is FALSE, i.e. SB has not reached 641 sb_task.c:L257 (whether or not L198 has run). (b) violated alone (EVS before L385, SB past L257) is possible but cannot crash on this path: U3 takes EVS_IsFiltered(SB id). (a) violated alone (EVS past L385) cannot crash: if SB is before L198 the event carries AppId 0 = EVS (misattributed; the DEBUG event is then dropped, by CFE_EVS_DEFAULT_TYPE_FLAG 0xE 'Debug = OFF' at 641 cpu1 cfg L1424 if EVS is past L393, or by ActiveFlag FALSE if EVS is between L385 and L393); if SB is between L198 and L257, EVS_NotRegistered(SB id) emits one ERROR event 'App %s not registered with Event Services. Unable to send event.' plus a syslog line (641 evs_utils.c:L199-L215)."

