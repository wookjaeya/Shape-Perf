    value: "sequential, startup-script order (StartApplications -> ParseFileEntry -> AppCreate -> StartAppTask -> OS_TaskCreate)"
    reference: "https://github.com/nasa/cFE/blob/98f78e8604c19415fd1e199eae94196a781539b8/modules/es/fsw/src/cfe_es_apps.c#L75-L263"
