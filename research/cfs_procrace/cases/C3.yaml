issue_body_verbatim:
  note: "Fragments as returned by WebFetch; '+' joins consecutive fragments. Formatting not guaranteed."
  paragraph: "The \"core\" applications have significant dependencies between them that need to be more pro-actively satisfied. There are some race conditions during the startup phase that can pose some serious problems if things are not executed in the right order."
  list1:
    - "Start up code should synchronize at least the \"core\" applications + and ensure that each one has reached it's respective \"RunLoop\" before starting the next one, + regardless of what the platform config sets the priority to + (likely depends on [CFE ES \"StartupSyncSemaphore\" subject to multiple race conditions #71]"
    - "EVS_IsFiltered should range check before doing the table lookups based on passed-in values"
    - "CFE SB and EVS (at least) populate different values into their own \"AppID\" global variable before initialization. + SB does nothing (0 by default, which is in fact a valid AppID for a different app) but + EVS initializes this to 0xFFFFFFFFF, which has very ill-effects if actually used for something + and nothing really checks for this."
  lead_in: "For those interested, here are the details of the specific sequence of events discovered when debugging application startup on the Microblaze processor used by the EVA team at GRC:"
  list2:
    - "As dictated by the table within \"cfe_es_objtab.c\", the CFE core applications are started (Tasks Created) in the order of EVS, SB, ES, TIME, BL."
    - "In the default/example platform configuration, these have respective priorities of 61(EVS), 64(SB), 68(ES), 60(TIME), and 70(TBL)."
    - "TIME task will run it's TaskMain first even though it is 4th in the start sequence."
    - "As part of this init sequence, it calls CFE_SB_CreatePipe() which in turn calls CFE_EVS_SendEventWithAppID() in several places (for errors as well as an unconditional \"debug event\" at the end). The AppId supplied is \"CFE_SB.AppId\" which is uninitialized since SB has not executed yet. In this case the value used is actually 0."
    - "In turn this eventually calls EVS_NotRegistered() (since CFE_EVS_TaskInit has not run) and then EVS_SendEvent() as part of that."
    - "EVS_SendEvent() calls EVS_IsFiltered() with the contents of CFE_EVS_GlobalData.EVS_AppID, which is also uninitialized but set to \"0xFFFFFFFF\", not zero like CFE_SB.AppId."
    - "This appID value is not range-checked by EVS_IsFiltered and ultimately segfaults and crashes CFE core."
  typos_noted: ["'0xFFFFFFFFF' (9 F) in list1 item 3 vs '0xFFFFFFFF' in list2 item 6 and code", "'BL' in list2 item 1 = TBL (item 2)"]

