  - name: task priorities
    value: "startup-script field 5; OSAL 0 = highest; POSIX RT priorities only with permission, else permissive fallback; cFE sample native config sets OSAL_CONFIG_DEBUG_PERMISSIVE_MODE TRUE; public BP CI: CF 65, BP 55"
