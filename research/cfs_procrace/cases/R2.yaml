  why_invalid: "inference from code+constants: CFE_ResourceId_ToIndex computes Serial = 0 - CFE_ES_APPID_BASE; BASE = MARK | (0x11 << 16) = 0x00110000 (SIMPLE) or 0x02110000 (STRICT); Serial wraps to 0xFFEF0000 / 0xFDEF0000 > 0xFFFF -> NOT_VALID -> EVS_GetAppDataByID returns NULL -> CFE_EVS_APP_ILLEGAL_APP_ID. Independent of OMIT_DEPRECATED."
