    value: "ES waits LATE_INIT then RUNNING before OPERATIONAL; only callers of WaitForSystemState/WaitForStartupSync block; timeout CFE_PLATFORM_ES_STARTUP_SCRIPT_TIMEOUT_MSEC=1000 in sample cfg"
    reference: "https://github.com/nasa/cFE/blob/98f78e8604c19415fd1e199eae94196a781539b8/modules/es/fsw/src/cfe_es_start.c#L203-L236"
