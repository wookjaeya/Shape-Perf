  - id: r2_analysis_comment
    url: https://github.com/nasa/cFE/issues/2663#issuecomment-5588955819
    what: "Follow-up analysis cited by the roadmap as [R2-analysis]. Comments are not rendered logged-out; REST and GitHub MCP refused. Text retrieved IN PART as github.com/search result snippets."
    retrieval: "model-mediated WebFetch of github.com/search (type=issues) result snippets, truncated, 2026-10-08; apostrophes dropped by the search page and restored here; HTTP 429 seen, retries succeeded; verify in a browser before quoting in the paper."
    snippet_log: /home/user/work/procrace/src/R2/retrieval/github_search_snippets_20261008.tsv
    snippet_fragments_in_order:  # order inferred from overlapping snippets; "[gap]" = text no snippet showed
      - "Hi all, I opened #2820 for this and after a closer read I am closing it: the change there is vacuous"
      - "(EVS_GetAppDataByID is deterministic in the ID, so a caller whose AppId equals the event's AppId [gap]"
      - "already resolves to the same record; the UT only passed through a deferred stub return code)."
      - "Sharing what the read turned up in case it helps whoever picks this up."
      - "The ILLEGAL_APP_ID at startup comes from SB, not from the caller EVS is checking."
      - "ES and EVS each create their command pipe inside their own task init (cfe_es_task.c:367, cfe_evs_task.c:289)."
      - "SB attributes pipe-creation events to [gap] itself using CFE_SB_Global.AppId, but that field is only filled in CFE_SB_AppInit (cfe_sb_task.c:138) when the SB task runs."
      - "Whichever core app's init runs before that sees SB call CFE_EVS_SendEventWithAppID with an undefined AppId, which is exactly the error reported here."
      - "Two ways to fix that I can see: have SB resolve its AppId lazily on first use (a one-line check in the event path), or have [gap] CFE_SB_EarlyInit record it since ES already knows the SB app id at that point."
      - "Happy to write either one with a UT if the team has a preference; otherwise I will leave this with you since it was marked as tracked internally."
      - "Have a great day!"
    reading:
      deterministic_term: "describes EVS_GetAppDataByID ('is deterministic in the ID'), explaining why PR #2820 is vacuous; NOT a race-vs-deterministic classification of R2."
