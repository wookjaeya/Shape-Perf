required_order:
  statement: "Before TIME (or any task) executes CFE_SB_CreatePipe and its event calls with CFE_SB.AppId: (a) SB has published CFE_SB.AppId and registered with EVS (CFE_SB_AppInit), and (b) EVS has completed CFE_EVS_TaskInit (EVS_AppID valid, EVS registered). Sufficient form stated by the issue: each core app reaches its main loop before the next core app starts, regardless of priority."
  provenance:
    - "#73 list1 item 1 (requirement) and list2 items 3-7 (failing order)"
    - "6.4.2 VDD Table 1.2-2 row Trac #40 ('forces each core application to reach its respective main loop before the next core application will be started regardless of the platform's priority settings')"
    - "6.4.2 VDD Table 1.2-2 row Trac #42 ('set the EVS_AppID value last. This will assure that all other initialization is done before the AppID is valid')"
  inference: "Crash requires both (a) and (b) violated. (b) violated alone is impossible on this path: if SB registered, U3 takes EVS_IsFiltered(SB id). If only (a) violated (EVS initialized, SB not), the event is attributed to AppId 0 = EVS: misattribution, no crash."

