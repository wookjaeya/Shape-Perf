fix:
  commit:
    trac: ["465a958 (Add additional sync state for apps)", "b227d57 (Remove stale comment in CFE_ES_ExitApp)"]
    trac_public: false
    first_public_commit: 2661d19f45dd325daf068e81a2967cbcc08ccab8
    release_tag: v6.6.0a (8811c92094512975e14fd545df355705141560b2)
    linkage_to_issue: "inference (D1): #198 == Trac #167"
  kind: order_guarantee
  kind_detail: "new startup barrier phase (APPS_INIT) with per-app LATE_INIT/RUNNING states and CFE_ES_WaitForSystemState(); opt-in; bounded by soft timeouts; not a retry or use-site guard"
  changes:
    - "CFE_ES_SystemState_APPS_INIT=4 added ('startup apps have all completed their early init, but not necessarily operational yet'); OPERATIONAL=5"
    - "CFE_ES_AppState_{EARLY_INIT,LATE_INIT,RUNNING,WAITING,STOPPED}; counters AppStartedCount/AppReadyCount removed"
    - "int32 CFE_ES_WaitForSystemState(MinSystemState, TimeOutMilliseconds): APPS_INIT->caller LATE_INIT, OPERATIONAL->caller RUNNING; returns CFE_ES_OPERATION_TIMED_OUT on timeout"
    - "void CFE_ES_WaitForStartupSync() = WaitForSystemState(OPERATIONAL) wrapper, status discarded"
    - "ES main: StartApplications -> MainTaskSyncDelay(LATE_INIT) -> APPS_INIT -> MainTaskSyncDelay(RUNNING) -> OPERATIONAL; each wait soft (log and continue)"
  references:
    - https://github.com/nasa/cFE/blob/8811c92094512975e14fd545df355705141560b2/fsw/cfe-core/src/es/cfe_es_api.c#L584-L689
    - https://github.com/nasa/cFE/blob/8811c92094512975e14fd545df355705141560b2/fsw/cfe-core/src/es/cfe_es_start.c#L198-L233
    - https://github.com/nasa/cFE/blob/8811c92094512975e14fd545df355705141560b2/fsw/cfe-core/src/es/cfe_es_start.c#L949-L1005
    - https://github.com/nasa/cFE/blob/8811c92094512975e14fd545df355705141560b2/fsw/cfe-core/src/inc/cfe_es.h#L616-L677
    - https://github.com/nasa/cFE/blob/8811c92094512975e14fd545df355705141560b2/fsw/cfe-core/src/inc/cfe_es_extern_typedefs.h#L178-L310
  guarantees:
    - "G1 (inference from code): if P calls WaitForSystemState(APPS_INIT) after early init, does late init, then becomes RUNNING, ES does not set OPERATIONAL before P is RUNNING, so R waiting on OPERATIONAL is released after P's late init - unless the ES phase-2 soft timeout (CFE_PLATFORM_ES_STARTUP_SCRIPT_TIMEOUT_MSEC; sample 1000 ms) or R's own timeout expires."
    - "G2 (inference from code): when APPS_INIT is entered, all started apps are >= LATE_INIT (early init done), same timeout caveat."
  not_guaranteed:
    - "ordering among late-init phases of two apps both waiting for APPS_INIT"
    - "requests from apps that never wait on OPERATIONAL"
    - "apps started after startup"
    - "notification of timeout to the caller of WaitForStartupSync (void); #1466/#1467 open"
    - "apps keeping the 6.4.2 pattern (WaitForStartupSync before late init) still declare RUNNING early - fix requires P to opt in (inference from cfe_es_api.c#L632-L637 at 8811c920)"

