    value: "facts at cFE 98f78e8 (pairing assumed, A1): ES makes two sequential waits after StartApplications, all apps LATE_INIT (cfe_es_start.c L212) then all apps RUNNING (L227), each bounded by CFE_PLATFORM_ES_STARTUP_SCRIPT_TIMEOUT_MSEC=1000 (sample cfg); on timeout it logs 'Startup Sync failed' and enters OPERATIONAL anyway (L235-L236). Only callers of WaitForSystemState/WaitForStartupSync block. CFE_ES_WaitForStartupSync(T) = CFE_ES_WaitForSystemState(OPERATIONAL, T) (cfe_es_api.c L688-L691); 'SYSTEM_STATE_OPERATIONAL requires that all apps are RUNNING' (L612); caller's own state raised to RUNNING (L641-L644); polls every STARTUP_SYNC_POLL_MSEC until state or caller timeout (L654-L675)"
    reference: "https://github.com/nasa/cFE/blob/98f78e8604c19415fd1e199eae94196a781539b8/modules/es/fsw/src/cfe_es_start.c#L203-L236 ; https://github.com/nasa/cFE/blob/98f78e8604c19415fd1e199eae94196a781539b8/modules/es/fsw/src/cfe_es_api.c#L595-L691"
    orders_create_before_lookup: "no for CF (CF does not wait); would if CF called WaitForStartupSync before InitEngine and provider creates before its first RunLoop, once ES reaches OPERATIONAL (all apps RUNNING or both ES timeouts expire) (inference; issue's suggestion, not implemented)"
    caller_timeout_argument: {value: null, status: unspecified_by_reference, note: "issue says only 'Adding a call to CFE_ES_WaitForStartupSync() before starting the engine might help too'"}
  - name: task priorities
    value: "startup-script field 5; OSAL 0 = highest; POSIX RT priorities only with permission, else permissive fallback; cFE sample native config sets OSAL_CONFIG_DEBUG_PERMISSIVE_MODE TRUE (native_osconfig.cmake L26-L39 @98f78e8 for the 2a024d8+caelum-rc4 path, assumed A1; BP path copies it from the bundle cFE at run time, common.yml L121: L39 @6cccb3f and @fef4a0d, inference); public BP CI: CF 65, BP 55"
    reference: "https://github.com/nasa/osal/blob/42af0f73c952b4e4c7fbc06c97d354a1430f4ac3/src/os/posix/src/os-impl-tasks.c#L296-L419"
    orders_create_before_lookup: "no guarantee (inference)"
  - name: OSAL object table locking
    value: "per-call atomicity (exclusive create transaction, global-lock FindByName)"
    reference: "https://github.com/nasa/osal/blob/42af0f73c952b4e4c7fbc06c97d354a1430f4ac3/src/os/shared/src/osapi-idmap.c#L1000-L1022"
    orders_create_before_lookup: false
  - name: fix retry (833fdbb)
    value: "up to 25 lookups, OS_TaskDelay(100) after each OS_ERR_NAME_NOT_FOUND"
    reference: "https://github.com/nasa/CF/blob/833fdbb27a26f15f2429e79392e7eb73d61abdea/fsw/src/cf_cfdp.c#L991-L1021"
    orders_create_before_lookup: "no; tolerance window only"

required_order:
  statement: "Reference level: for each CF channel i with non-empty sem_name, the provider's creation of the counting semaphore sem_name (OS_CountSemCreate) must have returned before CF's OS_CountSemGetIdByName(sem_name) in CF_CFDP_InitEngine (single attempt at 2a024d8 L1014-L1015). Otherwise CF_EID_ERR_INIT_SEM, engine not enabled, CF exits with APP_ERROR. After 833fdbb: creation must complete before the last of up to 25 lookups spaced by OS_TaskDelay(100)."
  statement_refinement_inference: "from OSAL code reading (C1.md section 4), not a reference: visibility by name with OS_SUCCESS requires OS_ObjectIdTransactionFinish to set active_id to its final value; a lookup in the RESERVED window is a separate hypothesized case"
  provenance:
    - "issue #184: 'the CF app expects that semaphore to be created _before_ it starts' / 'if that fails, CF aborts'"
    - "issue #178: 'it expects the semaphore to be created before CF starts'"
    - "CF docs @2a024d8 cf_guide.md L48-L57: 'must match the name of the semaphore created by TO' / 'If a semaphore is expected and not found, the application will terminate during initialization'"
    - "code @2a024d8: cf_cfdp.c L1012-L1023, cf_app.c L359-L375, L445-L449, L453, L481"
    - "fix comment @833fdbb cf_cfdp.c L993-L999: 'if this sem is instantiated by another app, it may not be created yet'"
  not_used_as_provenance: "current docs cfs_cf.dox L372-L392 (claims 'not-in-use' fallback and 'CF has code to ensure...'), contradicted by code"

fix:
  commit: 833fdbb27a26f15f2429e79392e7eb73d61abdea
  pr: "https://github.com/nasa/CF/pull/342"
  merged: "2022-12-01T19:35:23Z (2ffbeccc3e75fc69cd4a10652e7cc6abc2e4c90e)"
  kind: retry
  constants:
    CF_STARTUP_SEM_MAX_RETRIES: {value: 25, reference: "https://github.com/nasa/CF/blob/833fdbb27a26f15f2429e79392e7eb73d61abdea/fsw/platform_inc/cf_platform_cfg.h#L329-L338"}
    CF_STARTUP_SEM_TASK_DELAY: {value: 100, unit: ms, reference: "https://github.com/nasa/CF/blob/833fdbb27a26f15f2429e79392e7eb73d61abdea/fsw/platform_inc/cf_platform_cfg.h#L340-L349"}
  guarantees:
    - "retries OS_CountSemGetIdByName up to 25 times, delaying 100 ms after each OS_ERR_NAME_NOT_FOUND"
    - "any other non-success status ends the loop immediately and init fails"
    - "after the limit, init still fails with OS_ERR_NAME_NOT_FOUND (unit test cf_cfdp_tests.c L874-L880)"
    - "no ordering guarantee, no startup sync, no disabled-engine fallback"
  not_covered_inference:
    - "provider creation later than the retry window"
    - "provider restart / sem ID change (issue's secondary problem)"
    - "transient non-NAME_NOT_FOUND statuses (hypothesized OS_ERR_INCORRECT_OBJ_STATE window)"
    - "in that window the count-sem table lock may stay held so the provider blocks in OS_CountSemCreate (code reading, unverified); a CF-side retry cannot address it"

